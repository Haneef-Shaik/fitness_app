name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  domain-typescript:
    name: TypeScript domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Domain tests (shared vectors)
        run: pnpm --filter @fitlog/domain test
      - run: pnpm --filter @fitlog/domain typecheck

  api-python:
    name: Python domain + API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fitlog
          POSTGRES_PASSWORD: fitlog
          POSTGRES_DB: fitlog_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U fitlog -d fitlog_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fitlog:fitlog@localhost:5433/fitlog_test
      DATABASE_URL: postgresql+asyncpg://fitlog:fitlog@localhost:5433/fitlog_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - working-directory: services/api
        run: uv sync --frozen
      - name: Lint
        working-directory: services/api
        run: uv run ruff check .
      - name: Tests — domain vectors, migrations, API integration
        working-directory: services/api
        run: uv run pytest -q

  api-types:
    name: API types are in sync
    runs-on: ubuntu-latest
    # No Postgres service: the OpenAPI document is built from code, not from the
    # database, so this job only needs the app to import.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: pnpm install --frozen-lockfile
      - working-directory: services/api
        run: uv sync --frozen
      - name: Regenerate from the live OpenAPI document
        run: pnpm --filter @fitlog/api-types generate
      - name: A stale type is a failed build (D3b)
        run: |
          git diff --exit-code packages/api-types/src/schema.d.ts \
            || { echo "::error::packages/api-types/src/schema.d.ts is stale. Run: pnpm --filter @fitlog/api-types generate"; exit 1; }
      - run: pnpm --filter @fitlog/api-types typecheck

  mobile:
    name: Mobile client — types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @fitlog/mobile typecheck
      - name: Tests with the coverage gate
        run: pnpm --filter @fitlog/mobile test:ci

  contract:
    name: Cross-language contract
    runs-on: ubuntu-latest
    needs: [domain-typescript, api-python]
    steps:
      - uses: actions/checkout@v4
      - name: Both suites load the same vectors
        run: |
          set -e
          grep -q "contracts/vectors/domain.json" packages/domain/test/vectors.test.ts \
            || { echo "TypeScript suite no longer loads the shared vectors"; exit 1; }
          grep -q '"contracts"' services/api/tests/test_vectors.py \
            || { echo "Python suite no longer loads the shared vectors"; exit 1; }
          echo "Both suites are wired to contracts/vectors/domain.json"
