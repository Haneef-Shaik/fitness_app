name: Mobile foundation

on:
  pull_request:
  push:
    branches: [main, v2/develop]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm check
      - run: pnpm --filter @fitlog/mobile exec expo install --check
      - run: pnpm --filter @fitlog/mobile export:web
      - run: pnpm --filter @fitlog/mobile exec expo export --platform ios --platform android --output-dir .expo/export-native
