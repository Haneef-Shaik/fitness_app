name: Mobile foundation

on:
  pull_request:
  push:
    branches: [main, v2/develop]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      # Trusted base for the contract history guard, taken from the event and never from the change: the pull request's
      # base commit, or the previous head of a push. There is no HEAD fallback; any other event gets '' and fails below.
      FITLOG_CONTRACT_BASELINE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the trusted contract baseline
        shell: bash
        run: |
          if [[ -z "$FITLOG_CONTRACT_BASELINE" ]]; then
            echo "::error::FITLOG_CONTRACT_BASELINE is missing: the ${GITHUB_EVENT_NAME} event gave no pull request base or previous push head"
            exit 1
          fi
          if [[ "$FITLOG_CONTRACT_BASELINE" =~ ^0+$ ]]; then
            echo "::error::FITLOG_CONTRACT_BASELINE is the all-zero SHA: the push created the branch, so there is no previous head to trust"
            exit 1
          fi
          if [[ ! "$FITLOG_CONTRACT_BASELINE" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]]; then
            echo "::error::FITLOG_CONTRACT_BASELINE is not a full commit SHA"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm check
      - run: pnpm --filter @fitlog/mobile exec expo install --check
      - run: pnpm --filter @fitlog/mobile export:web
      - run: pnpm --filter @fitlog/mobile exec expo export --platform ios --platform android --output-dir .expo/export-native
