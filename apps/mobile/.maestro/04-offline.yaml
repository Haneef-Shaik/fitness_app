# The offline flow: log with no network, force-quit, relaunch, resume, restore,
# and assert the server matches with zero duplicate sets.
#
# This is the half that CANNOT be proven on web: expo-sqlite has no web build,
# so the browser store is in-memory and nothing survives a relaunch. On a device
# it is SQLite, which is what makes this flow meaningful.
appId: host.exp.Exponent
name: Offline logging survives a relaunch
---
- openLink: volt://train/start
- tapOn:
    text: "Start Chest.*"
- tapOn: "Save set 1"
- assertVisible: "Set 1, .*"

- runFlow:
    name: go offline
    commands:
      - setAirplaneMode: enabled

# Two sets with no network at all. They must commit instantly (I10) and say so.
- tapOn: "Save set 2"
- assertVisible: "Set 2, .*"
- tapOn: "Save set 3"
- assertVisible: "Set 3, .*"
- assertVisible:
    text: "Waiting to sync"
    index: 0

# Force-quit and relaunch: the draft must come back from SQLite.
- stopApp
- openLink: volt://train/start
- assertVisible: "You're mid-workout"
- tapOn: "Resume"
- assertVisible: "Set 3, .*"

- runFlow:
    name: back online
    commands:
      - setAirplaneMode: disabled

# The queue drains. Every set syncs exactly once — idempotent on client_id (I8).
- assertVisible:
    text: "Synced"
    index: 2
- assertNotVisible: "Waiting to sync"

- tapOn: "Finish workout"
- assertVisible: "Workout finished"
