<title>FitLog Foundations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">

<style>
/* ============================================================
   FITLOG — design tokens
   Dark-first. :root carries DARK; light is the deliberate swap.
   Style: Modern Dark (Cinema Mobile) — layered, never flat.
   ============================================================ */
:root{
  color-scheme: dark;
  --page:#0E0F11; --canvas:#0A0B0C; --surface:#17181A; --surface-2:#1F2124; --sunken:#0B0C0E;
  --ink:#FFFFFF; --ink-2:#B9BBB6; --ink-3:#7E817B;
  --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.14);
  --accent:#B0A4FF; --accent-hi:#C9C1FF; --accent-ink:#0E0F11; --accent-wash:rgba(176,164,255,.13);
  --good:#3FD07B; --warn:#FAB219; --serious:#EC835A; --crit:#FF6B6B;
  --s1:#3987E5; --s2:#D95926; --s3:#199E70;
  /* depth — the thing the first version was missing entirely */
  --sheen: inset 0 1px 0 rgba(255,255,255,.07);
  --card-bg: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
  --elev-1: var(--sheen), 0 1px 2px rgba(0,0,0,.5);
  --elev-2: var(--sheen), 0 8px 24px -8px rgba(0,0,0,.7);
  --elev-3: var(--sheen), 0 20px 48px -12px rgba(0,0,0,.8);
  --glow: 0 12px 28px -12px rgba(176,164,255,.65);
  --ambient: radial-gradient(95% 42% at 50% -8%, rgba(176,164,255,.11), transparent 62%);
  --r-phone:46px; --r-lg:18px; --r-card:16px; --r-btn:13px; --r-row:11px; --r-pill:999px;
  --ff-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ff-data:"Barlow Condensed","Barlow",system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --page:#F4F5F3; --canvas:#E7E9E5; --surface:#FFFFFF; --surface-2:#FFFFFF; --sunken:#EDEFEB;
    --ink:#0B0C0D; --ink-2:#4B4D48; --ink-3:#6E706A;
    --line:rgba(11,12,13,.11); --line-2:rgba(11,12,13,.2);
    --accent:#5A31C4; --accent-hi:#4A2AA6; --accent-ink:#FFFFFF; --accent-wash:rgba(90,49,196,.09);
    --good:#0C8F3C; --crit:#D03B3B; --s1:#2A78D6; --s2:#EB6834; --s3:#1BAF7A;
    --sheen: inset 0 1px 0 rgba(255,255,255,.9);
    --card-bg: linear-gradient(180deg,#FFFFFF,#FCFCFB);
    --elev-1: 0 1px 2px rgba(11,12,13,.07);
    --elev-2: 0 8px 22px -10px rgba(11,12,13,.18);
    --elev-3: 0 20px 44px -14px rgba(11,12,13,.22);
    --glow: 0 12px 26px -14px rgba(90,49,196,.5);
    --ambient: radial-gradient(95% 42% at 50% -8%, rgba(90,49,196,.07), transparent 62%);
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --page:#F4F5F3; --canvas:#E7E9E5; --surface:#FFFFFF; --surface-2:#FFFFFF; --sunken:#EDEFEB;
  --ink:#0B0C0D; --ink-2:#4B4D48; --ink-3:#6E706A;
  --line:rgba(11,12,13,.11); --line-2:rgba(11,12,13,.2);
  --accent:#5A31C4; --accent-hi:#4A2AA6; --accent-ink:#FFFFFF; --accent-wash:rgba(90,49,196,.09);
  --good:#0C8F3C; --crit:#D03B3B; --s1:#2A78D6; --s2:#EB6834; --s3:#1BAF7A;
  --sheen: inset 0 1px 0 rgba(255,255,255,.9);
  --card-bg: linear-gradient(180deg,#FFFFFF,#FCFCFB);
  --elev-1: 0 1px 2px rgba(11,12,13,.07);
  --elev-2: 0 8px 22px -10px rgba(11,12,13,.18);
  --elev-3: 0 20px 44px -14px rgba(11,12,13,.22);
  --glow: 0 12px 26px -14px rgba(90,49,196,.5);
  --ambient: radial-gradient(95% 42% at 50% -8%, rgba(90,49,196,.07), transparent 62%);
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--ff-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--page) 82%,transparent);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1400px;margin:0 auto;padding-block:13px;padding-left:22px;padding-right:22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.wordmark{display:flex;align-items:center;gap:10px;font-family:var(--ff-data);font-weight:700;font-size:21px;letter-spacing:.05em;text-transform:uppercase}
.bolt{width:19px;height:19px;flex:none;color:var(--accent);filter:drop-shadow(0 0 10px var(--accent-wash))}
.wordmark .sub{font-family:var(--ff-ui);font-weight:500;font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.tabs{display:flex;gap:2px;background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-pill);padding:3px}
.tab{padding:7px 16px;border-radius:var(--r-pill);font-size:13.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;transition:color .15s}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--ink);box-shadow:var(--elev-1)}
.spacer{flex:1 1 auto}
.chip-btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--ink-2);background:var(--sunken)}
.chip-btn:hover{border-color:var(--line-2);color:var(--ink)}
.chip-btn svg{width:15px;height:15px}
.sheetwrap{max-width:1400px;margin:0 auto;padding-left:22px;padding-right:22px;padding-block:30px 80px}

.board-head{margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.board-head h1{font-family:var(--ff-data);font-size:38px;font-weight:700;letter-spacing:.005em;line-height:1.05}
.board-head .meta{font-size:14.5px;color:var(--ink-2);max-width:62ch;margin-top:9px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3);margin-top:14px}
.legend b{color:var(--ink-2);font-weight:600}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,250px));gap:38px 32px;justify-content:start}
.cell{display:flex;flex-direction:column;gap:12px}
.cellcap .id{font-family:var(--ff-data);font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--accent)}
.cellcap .nm{font-size:14px;font-weight:600;display:block;margin-top:1px}
.cellcap .rt{font-size:11.5px;color:var(--ink-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;display:block;margin-top:2px}
.framewrap{width:250px;height:541px;position:relative}
.framewrap .phone{transform:scale(.641);transform-origin:top left}
.board .phone{pointer-events:none}
.board .cell .open{position:absolute;inset:0;z-index:5;border-radius:30px;background:transparent;transition:box-shadow .18s var(--ease)}
.board .cell .open:hover{box-shadow:0 0 0 2px var(--accent),0 20px 50px -20px rgba(0,0,0,.9)}

.phone{width:390px;height:844px;flex:none;position:relative;background:var(--ambient),var(--page);border-radius:var(--r-phone);border:1px solid var(--line-2);box-shadow:var(--elev-3);overflow:hidden;display:flex;flex-direction:column;font-size:15px}
.statusbar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 32px;font-family:var(--ff-data);font-weight:600;font-size:15.5px;letter-spacing:.02em}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.homebar{height:24px;flex:none;display:flex;align-items:center;justify-content:center}
.homebar i{display:block;width:134px;height:5px;border-radius:3px;background:var(--ink);opacity:.26}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scr-head{flex:none;padding:2px 20px 12px}
.scr-body{flex:1;min-height:0;overflow-y:auto;padding:0 20px 8px;scrollbar-width:none}
.scr-body::-webkit-scrollbar{display:none}
.scr-foot{flex:none;padding:14px 20px 8px;background:linear-gradient(180deg,transparent,var(--page) 22%);border-top:1px solid var(--line)}
.lbl{font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.lblrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.nav{display:flex;align-items:center;gap:11px;min-height:40px}
.nav .ico{width:34px;height:34px;margin-left:-7px;display:grid;place-items:center;border-radius:var(--r-pill);color:var(--ink);transition:background .15s}
.nav .ico:hover{background:var(--surface)}
.nav .ico svg{width:20px;height:20px}
.nav .ttl{font-size:17px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.nav .sub{font-size:12.5px;color:var(--ink-3);margin-top:1px}
.nav .right{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--ink-3)}
.nav .right svg{width:18px;height:18px}
.card{background:var(--card-bg),var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--elev-1);padding:16px}
.card.hero{padding:18px;border-radius:var(--r-lg);box-shadow:var(--elev-2)}
.card.accent{border-color:color-mix(in srgb,var(--accent) 42%,transparent);background:linear-gradient(180deg,var(--accent-wash),transparent 62%),var(--surface)}
.well{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-card);padding:13px 14px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;border-radius:var(--r-btn);font-weight:600;font-size:16px;letter-spacing:.005em;transition:transform .12s var(--ease),filter .15s,background .15s}
.btn:active{transform:scale(.975)}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:var(--accent-ink);box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:var(--card-bg),var(--surface);border:1px solid var(--line);color:var(--ink-2);box-shadow:var(--elev-1)}
.btn-ghost:hover{border-color:var(--line-2);color:var(--ink)}
.btn-danger{color:var(--crit);border:1px solid transparent}
.btn-danger:hover{border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn-sm{min-height:46px;font-size:14.5px}
.btnrow{display:flex;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:var(--card-bg),var(--surface);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--elev-1);padding:13px 9px;display:flex;flex-direction:column;align-items:center;gap:7px;transition:transform .12s var(--ease),border-color .15s}
.tile:active{transform:scale(.97)}
.tile:hover{border-color:var(--line-2)}
.tile svg{width:19px;height:19px;color:var(--ink-2)}
.tile span{font-size:12px;font-weight:600;color:var(--ink-2)}
.num{font-family:var(--ff-data);font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.005em}
.display{font-family:var(--ff-data);font-weight:700;line-height:.92;letter-spacing:-.018em;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.pill-mute{background:var(--sunken);color:var(--ink-3);border:1px solid var(--line)}
.pill-live{background:var(--accent-wash);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.pill-pr{background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:var(--accent-ink);box-shadow:0 4px 12px -6px rgba(176,164,255,.8)}
.musc{display:flex;gap:6px;flex-wrap:wrap}
.musc span{font-size:11.5px;color:var(--ink-3);padding:3px 9px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--sunken)}
.musc span.p{color:var(--ink-2);border-color:var(--line-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r-card);overflow:hidden;border:1px solid var(--line)}
.stats>div{background:var(--surface);padding:14px 10px;text-align:center}
.stats .v{font-family:var(--ff-data);font-weight:700;font-size:27px;line-height:1;font-variant-numeric:tabular-nums}
.stats .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:5px}
.meter{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent-hi));box-shadow:0 0 12px var(--accent-wash)}
.dots{display:flex;gap:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2);display:block}
.dots i.on{background:var(--accent);box-shadow:0 0 8px var(--accent-wash)}
.exlist{display:flex;flex-direction:column;gap:2px}
.ex{display:flex;gap:13px;align-items:flex-start;padding:13px 12px;border-radius:var(--r-card);transition:background .15s}
.ex.now{background:var(--card-bg),var(--surface);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);box-shadow:var(--elev-1)}
.ex:not(.now):hover{background:rgba(255,255,255,.025)}
.exn{width:24px;height:24px;flex:none;margin-top:1px;border-radius:50%;display:grid;place-items:center;font-family:var(--ff-data);font-size:12.5px;font-weight:700;border:1.5px solid var(--line-2);color:var(--ink-3)}
.exn svg{width:12px;height:12px}
.exn.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.exn.now{border-color:var(--accent);color:var(--accent);background:var(--accent-wash)}
.exb{flex:1;min-width:0}
.exname{font-weight:600;font-size:15px;letter-spacing:-.01em}
.exmeta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.exsets{font-family:var(--ff-data);font-variant-numeric:tabular-nums;font-size:14px;color:var(--ink-2);margin-top:6px;letter-spacing:.02em}
.prevchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.prevchips b{font-family:var(--ff-data);font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 10px;letter-spacing:.02em}
.settbl{width:100%;border-collapse:separate;border-spacing:0 3px;font-variant-numeric:tabular-nums}
.settbl th{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:0 12px 6px 0}
.settbl th:first-child{text-align:left;width:32px;padding-left:12px}
.settbl th:last-child{width:46px;padding-right:12px}
.settbl td{padding:10px 12px 10px 0;text-align:right;font-family:var(--ff-data);font-weight:700;font-size:20px;letter-spacing:.005em;background:rgba(255,255,255,.028)}
.settbl td:first-child{text-align:left;font-size:13px;color:var(--ink-3);padding-left:12px;border-radius:var(--r-row) 0 0 var(--r-row)}
.settbl td:last-child{border-radius:0 var(--r-row) var(--r-row) 0;padding-right:12px}
.settbl tr.warm td{color:var(--ink-3);background:rgba(255,255,255,.014)}
.settbl .dlt{display:block;font-family:var(--ff-ui);font-size:10px;font-weight:600;margin-top:1px;line-height:1}
.dlt.up{color:var(--good)}.dlt.flat,.dlt.down{color:var(--ink-3)}
.tick{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;background:var(--accent);color:var(--accent-ink);vertical-align:middle}
.tick svg{width:13px;height:13px}
.sync{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
.sync.synced{background:var(--good)}.sync.pending{background:var(--warn)}
.pad{margin-top:12px;border-radius:var(--r-lg);padding:15px 16px 16px;background:linear-gradient(180deg,var(--accent-wash),transparent 70%),var(--surface);border:1px solid color-mix(in srgb,var(--accent) 36%,transparent);box-shadow:var(--elev-2),inset 0 1px 0 rgba(255,255,255,.08)}
.padvals{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin:4px 0 12px}
.padv{display:flex;flex-direction:column;align-items:center;gap:2px}
.padv .n{font-family:var(--ff-data);font-weight:700;font-size:56px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.padv .u{font-size:10.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.padx{font-family:var(--ff-data);font-weight:600;font-size:26px;color:var(--ink-3);padding-bottom:12px}
.padctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps{display:flex;align-items:center;gap:8px;justify-content:center}
.sbtn{width:46px;height:46px;flex:none;border-radius:var(--r-row);background:var(--sunken);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);font-family:var(--ff-data);font-weight:700;font-size:21px;transition:transform .12s var(--ease),border-color .15s}
.sbtn:hover{border-color:var(--line-2)}
.sbtn:active{transform:scale(.93)}
.steps .cap{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);min-width:34px;text-align:center}
.rest{margin-bottom:12px;padding:12px 14px;border-radius:var(--r-card);background:linear-gradient(180deg,var(--accent-wash),transparent),var(--surface);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);display:flex;align-items:center;gap:13px;box-shadow:var(--elev-1)}
.rest .t{font-family:var(--ff-data);font-weight:700;font-size:30px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.rest .x{font-size:12.5px;color:var(--ink-2);flex:1}
.rest button{font-size:12px;font-weight:600;color:var(--ink-2);padding:6px 12px;border:1px solid var(--line-2);border-radius:var(--r-pill)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week .d{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.week .m{height:30px;border-radius:9px;background:var(--sunken);border:1px solid var(--line);margin-top:6px;display:grid;place-items:center}
.week .m.done{background:linear-gradient(180deg,var(--accent-hi),var(--accent));border-color:transparent;box-shadow:0 5px 14px -7px rgba(176,164,255,.9)}
.week .m.done svg{width:12px;height:12px;color:var(--accent-ink)}
.week .m.today{border-color:var(--accent);border-style:dashed}
.kv{display:flex;align-items:baseline;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-3)}
.kv .v{font-family:var(--ff-data);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.linkrow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
.linkrow:last-child{border-bottom:0}
.linkrow .t{flex:1}
.linkrow .t b{display:block;font-size:14.5px;font-weight:600}
.linkrow .t span{font-size:12.5px;color:var(--ink-3)}
.linkrow .c{color:var(--ink-3);font-size:18px}
.ov{position:absolute;inset:0;background:rgba(6,7,9,.66);backdrop-filter:blur(3px);display:flex;align-items:flex-end;padding:20px;z-index:20}
.ov.mid{align-items:center;justify-content:center}
.ovc{width:100%;background:var(--card-bg),var(--surface-2);border:1px solid var(--line-2);border-radius:24px;padding:22px;box-shadow:var(--elev-3)}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.stack{display:flex;flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
.row{display:flex;align-items:center}.btw{justify-content:space-between}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.t2{color:var(--ink-2)}.t3{color:var(--ink-3)}
.f12{font-size:12.5px}.f13{font-size:13.5px}.f14{font-size:14.5px}

  def('E-02','Active session','/session/[id]',()=>{
    const rows=[
      {st:'done',n:'Barbell Bench Press',m:'4 of 4 sets &middot; 2,560 kg',s:'80&times;8 &middot; 80&times;8 &middot; 80&times;7 &middot; 77.5&times;8',pr:1,d:[1,1,1,1]},

        <div><div class="v">52</div><div class="k">Min</div></div><div><div class="v">8,240</div><div class="k">Last kg</div></div></div></div>
      <div class="lbl mt24">Nutrition</div>
      <div class="card mt8"><div class="display" style="font-size:44px">1,180</div></div>
    </div>
    <div class="ov"><div class="ovc">
      <div class="row g8" style="color:var(--accent)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 2 4 13.2h6L9.8 22 20 10.6h-6.4L13.5 2Z"/></svg>
        <span class="lbl" style="color:var(--accent)">Unfinished workout</span></div>
      <div class="display mt12" style="font-size:30px">Chest &amp; Triceps</div>
      <div class="f13 t3 mt4">Started 1h 12m ago &middot; 8 sets logged</div>
      <div class="well mt12"><div class="f12 t3">Last set</div>
        <div class="f14 w6 mt4">Incline DB Press &nbsp;<span class="num" style="font-size:17px">30</span> <span class="t3 f12">kg</span> &times; <span class="num" style="font-size:17px">9</span></div></div>
      <div class="stack g10 mt16">
        <button class="btn btn-primary btn-sm" data-go="E-02">Resume</button>
        <button class="btn btn-ghost btn-sm" data-go="E-08">Finish it now</button>
        <button class="btn btn-danger btn-sm">Discard</button></div>
      <p class="note mt12">Everything you logged is saved on this device. Nothing is lost.</p>
    </div></div>
  </div>`);

  def('E-11','Personal record','overlay &rarr; /session/finish',()=>`
  <div class="screen">
    <div class="scr-head"><div class="nav"><div><div class="ttl">Finish workout</div></div></div></div>
    <div class="scr-body" style="filter:blur(3px);opacity:.34" aria-hidden="true">
      <div class="display" style="font-size:34px">Chest<br>&amp; Triceps</div>
      <div class="card hero mt16" style="text-align:center"><div class="display" style="font-size:62px">8,940</div></div>
    </div>
    <div class="ov mid"><div class="ovc" style="text-align:center">
      <div style="width:56px;height:56px;margin:0 auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--accent-hi),var(--accent));color:var(--accent-ink);box-shadow:0 14px 30px -12px rgba(176,164,255,.9)">
        <span style="width:27px;height:27px;display:block">${I.trophy}</span></div>
      <div class="lbl mt16">New personal record</div>
      <div class="w6 mt8" style="font-size:19px">Barbell Bench Press</div>
      <div class="display" style="font-size:76px;color:var(--accent);margin-top:8px">102.5</div>
      <div class="f13 t3">kilograms &middot; previous best 100 kg</div>
      <div class="btnrow mt20">
        <button class="btn btn-ghost btn-sm">Progression</button>
        <button class="btn btn-primary btn-sm" data-go="E-01">Nice</button></div>
    </div></div>
  </div>`);

  const phone=i=>'<div class="phone">'+statusbar+i+homebar+'</div>';
  const byId=id=>SC.find(s=>s.id===id);
  let active='E-03';

  function board(){
    document.getElementById('view-board').innerHTML=
      '<div class="board-head"><h1>Workout logger</h1>'+
      '<p class="meta">The critical path &mdash; start, log, rest, finish, recover. Every set commit is local-first: it renders instantly and syncs behind the scenes, so the screen never waits on a network.</p>'+
      '<div class="legend"><span><b>6</b> screens</span><span><b>Dark</b> primary, light validated</span><span><b>390&times;844</b> frames</span><span>Tap a frame to open it in Prototype</span></div></div>'+
      '<div class="board">'+SC.map(s=>'<div class="cell"><div class="framewrap">'+phone(s.render())+
        '<button class="open" data-open="'+s.id+'" aria-label="Open '+s.id+' '+s.name+'"></button></div>'+
        '<div class="cellcap"><span class="id">'+s.id+'</span><span class="nm">'+s.name+'</span><span class="rt">'+s.route+'</span></div></div>').join('')+'</div>';
  }
  function play(){
    document.getElementById('view-play').innerHTML=
      '<div class="play"><div class="rail"><h2>Logger flow</h2>'+
      SC.map(x=>'<button class="rb" data-open="'+x.id+'" aria-current="'+(x.id===active)+'"><span class="id">'+x.id+'</span><span class="nm">'+x.name+'</span></button>').join('')+
      '<p class="playnote"><b style="color:var(--ink-2)">E&#8209;03 is live.</b> Use the steppers, save a set, watch the delta against last time and the rest timer start. Buttons inside the frame navigate for real.</p></div>'+
      '<div>'+phone(byId(active).render())+'</div></div>';
  }
  function repaint(){const h=document.querySelector('#view-play .play > div:last-child'); if(h) h.innerHTML=phone(byId(active).render());}

  const COLORS=[['--page','#0E0F11','#F4F5F3','App ground'],['--surface','#17181A','#FFFFFF','Cards, sheets'],
    ['--sunken','#0B0C0E','#EDEFEB','Wells, steppers'],['--ink','#FFFFFF','#0B0C0D','Primary text'],
    ['--ink-3','#7E817B','#6E706A','Labels, axes'],['--accent','#B0A4FF','#5A31C4','Primary action only'],
    ['--good','#3FD07B','#0C8F3C','Improvement, synced'],['--warn','#FAB219','#FAB219','Pending, low confidence'],
    ['--crit','#FF6B6B','#D03B3B','Failed, destructive'],['--s1 protein','#3987E5','#2A78D6','Chart series 1'],
    ['--s2 carbs','#D95926','#EB6834','Chart series 2'],['--s3 fat','#199E70','#1BAF7A','Chart series 3']];

  function found(){
    const st=document.documentElement.getAttribute('data-theme');
    const light=st==='light'||(!st&&matchMedia('(prefers-color-scheme: light)').matches);
    document.getElementById('view-found').innerHTML=`
    <section class="fsec"><h2>Depth</h2>
      <p class="lede">The first pass of this file was flat &mdash; one hairline and one radius stamped on every block, which erases hierarchy. Dark UI needs <em>layering</em>: a tinted gradient on each surface, a 1px inner top highlight so edges catch light, an ambient accent glow behind the top of the screen, and an elevation scale that actually differs between a row, a card, a pad and a dialog.</p>
      <div class="comps">
        <div class="comp"><div class="ch">Elevation scale</div><div class="cb stack g12">
          <div style="padding:12px;border-radius:11px;background:rgba(255,255,255,.028)"><div class="f12 t3">0 &mdash; row tint</div></div>
          <div class="card"><div class="f12 t3">1 &mdash; card: gradient + sheen</div></div>
          <div class="card hero"><div class="f12 t3">2 &mdash; hero / sheet</div></div>
          <div class="pad" style="margin:0"><div class="f12 t3">3 &mdash; entry pad: accent border + glow</div></div>
        </div></div>
        <div class="comp"><div class="ch">Buttons</div><div class="cb stack g10">
          <button class="btn btn-primary btn-sm">Save set 3</button>
          <button class="btn btn-ghost btn-sm">Same as last</button>
          <button class="btn btn-danger btn-sm">Discard workout</button>
          <p class="note">Primary carries a gradient, an inner top highlight and a cast glow. Press scales to .975.</p>
        </div></div>
        <div class="comp"><div class="ch">Set rows</div><div class="cb">
          <table class="settbl"><tbody>
            <tr class="warm"><td>W</td><td>20</td><td>12</td><td>&mdash;</td><td><span class="sync synced"></span><span class="tick">${I.check}</span></td></tr>
            <tr><td>1</td><td>30<span class="dlt up">&#9650; 30</span></td><td>10</td><td>8</td><td><span class="sync synced"></span><span class="tick">${I.check}</span></td></tr>
            <tr><td>2</td><td>30<span class="dlt flat">=</span></td><td>9</td><td>9</td><td><span class="sync pending"></span><span class="tick">${I.check}</span></td></tr>
          </tbody></table>
          <p class="note mt12">Rows are tinted plates, not ruled lines. Warm-ups recede. Green dot synced, amber queued &mdash; a failed write is a dot, never a modal over the logger.</p>
        </div></div>
        <div class="comp"><div class="ch">Progress encoding</div><div class="cb stack g12">
          <div class="dots"><i class="on"></i><i class="on"></i><i></i></div>
          <div class="meter"><i style="width:38%"></i></div>
          <div class="week">${['M','T','W','T','F'].map((d,i)=>'<div><div class="d">'+d+'</div><div class="m '+(i<2?'done':'')+'">'+(i<2?I.check:'')+'</div></div>').join('')}</div>
          <p class="note">Set dots read at a glance without counting. Meters glow faintly so they register as filled rather than merely coloured.</p>
        </div></div>
      </div>
    </section>
    <section class="fsec"><h2>Type</h2>
      <p class="lede">One superfamily, two widths. <b>Barlow Condensed</b> carries every number; <b>Barlow</b> carries the interface. The scale runs 10&rarr;76px &mdash; the first pass spanned only 11&rarr;27 and read as timid. Anything in a column gets <code>tabular-nums</code> so digits do not jitter as they change.</p>
      <div style="margin-top:20px">
        <div class="trow"><span class="sp">record &middot; Cond 700 &middot; 76px</span><span class="display" style="font-size:76px;color:var(--accent)">102.5</span></div>
        <div class="trow"><span class="sp">hero &middot; Cond 700 &middot; 66px</span><span class="display" style="font-size:66px">8,940</span></div>
        <div class="trow"><span class="sp">entry &middot; Cond 700 &middot; 56px</span><span class="display" style="font-size:56px">30</span></div>
        <div class="trow"><span class="sp">display &middot; Cond 700 &middot; 38px</span><span class="display" style="font-size:38px">Chest &amp; Triceps</span></div>
        <div class="trow"><span class="sp">stat &middot; Cond 700 &middot; 27px</span><span class="num" style="font-size:27px">8,940 kg</span></div>
        <div class="trow"><span class="sp">set cell &middot; Cond 700 &middot; 20px</span><span class="num" style="font-size:20px">102.5 &times; 8</span></div>
        <div class="trow"><span class="sp">title &middot; Barlow 600 &middot; 17px</span><span style="font-size:17px;font-weight:600">Incline Dumbbell Press</span></div>
        <div class="trow"><span class="sp">body &middot; Barlow 400 &middot; 15px</span><span>Log each set as you finish it.</span></div>
        <div class="trow"><span class="sp">label &middot; Barlow 600 &middot; 10.5px</span><span class="lbl">Last time &middot; 16 Sep</span></div>
      </div>
    </section>
    <section class="fsec"><h2>Colour</h2>
      <p class="lede">Dark is primary &mdash; a gym is a dark-lighting context and the logger is used at 6am. <b>Iris</b>, a blue-violet at OKLCH hue ~292&deg;, is the only accent: primary action, live pulse, calorie meter, active tab. Deliberately <em>not</em> a chart series colour, so a button never reads as data.</p>
      <div class="sw">${COLORS.map(c=>'<div class="swc"><div class="c" style="background:'+(light?c[2]:c[1])+'"></div><div class="m"><div class="n">'+c[0]+'</div><div class="h">'+(light?c[2]:c[1])+'</div><div class="u">'+c[3]+'</div></div></div>').join('')}</div>
      <div class="tblwrap"><table class="spec">
        <thead><tr><th>Pair</th><th>Value</th><th>Verdict</th></tr></thead><tbody>
        <tr><td>Iris on dark surface</td><td><code>8.12:1</code></td><td>AAA</td></tr>
        <tr><td>Near-black on iris fill</td><td><code>8.77:1</code></td><td>AAA &mdash; dark primary button</td></tr>
        <tr><td>Iris <code>#5A31C4</code> on white</td><td><code>7.86:1</code></td><td>AAA both directions</td></tr>
        <tr><td>Iris vs protein blue</td><td><code>&Delta;E 11.1</code></td><td>Worst-case CVD; target is 8</td></tr>
        <tr><td>Iris vs status-critical</td><td><code>&Delta;E 28.9</code></td><td>Primary can never read as destructive</td></tr>
      </tbody></table></div>
      <p class="lede mt16">Picked by sweeping the whole hue circle and scoring worst-case colour-vision-deficiency separation &mdash; not by taste. Rejected: lime measures &Delta;E <b>0.3</b> from series green under CVD in light mode, amber <b>1.8</b> from status-warning, magenta <b>7.4</b> from status-critical, and the off-the-shelf Tailwind violet <b>4.9</b> from protein blue.</p>
    </section>
    <section class="fsec"><h2>Rules this design is held to</h2>
      <div class="tblwrap"><table class="spec"><thead><tr><th>Rule</th><th>Why</th></tr></thead><tbody>
        <tr><td>A set commit never awaits the network</td><td>p95 tap-to-rendered under 100ms. Offline is indistinguishable from online except for the sync dot.</td></tr>
        <tr><td>No spinner between typing reps and seeing the set</td><td>The user has ~40s of rest. A loading state costs them a set.</td></tr>
        <tr><td>A regression is never red</td><td>A lighter day is information, not an error. Critical is reserved for what must be fixed.</td></tr>
        <tr><td>Estimated never looks like confirmed</td><td>Dashed border, sparkle, "Est." chip &mdash; and it adds nothing to any total until confirmed.</td></tr>
        <tr><td>The PR celebration waits for the summary</td><td>Interrupting someone mid-set to congratulate them is the worst thing the logger could do.</td></tr>
        <tr><td>Colour never carries meaning alone</td><td>Every status pairs a hue with an icon, a label, or both.</td></tr>
        <tr><td>Press states never move layout</td><td>Scale and opacity only &mdash; no jitter, no reflow.</td></tr>
      </tbody></table></div>
    </section>`;
  }

  function stopRest(){ if(timer){clearInterval(timer);timer=null;} S.restOn=false;S.rest=0; }
  function startRest(){
    stopRest(); S.restOn=true; S.rest=120; repaint();
    timer=setInterval(()=>{
      S.rest--;
      if(S.rest<=0){stopRest();repaint();return;}
      const e=document.querySelector('[data-rest]');
      if(e) e.textContent=Math.floor(S.rest/60)+':'+String(S.rest%60).padStart(2,'0'); else stopRest();
    },1000);
  }
  document.addEventListener('click',e=>{
    const t=e.target.closest('.tab'); if(t){setView(t.dataset.view);return;}
    const o=e.target.closest('[data-open]'); if(o){active=o.dataset.open;setView('play');return;}
    if(!e.target.closest('#view-play')) return;
    const g=e.target.closest('[data-go]'); if(g){active=g.dataset.go; if(active!=='E-03') stopRest(); play(); return;}
    const a=e.target.closest('[data-act]'); if(!a) return;
    switch(a.dataset.act){
      case 'l+':S.entry.load=Math.min(200,S.entry.load+2.5);break;
      case 'l-':S.entry.load=Math.max(0,S.entry.load-2.5);break;
      case 'r+':S.entry.reps=Math.min(100,S.entry.reps+1);break;
      case 'r-':S.entry.reps=Math.max(1,S.entry.reps-1);break;
      case 'rep':{const l=[...S.sets].reverse().find(x=>x.k!=='W'); if(l){S.entry.load=l.load;S.entry.reps=l.reps;} break;}
      case 'skip':stopRest();repaint();return;
      case 'save':{
        S.sets.push({k:working().length+1,load:S.entry.load,reps:S.entry.reps,rpe:S.entry.rpe,s:'pending'});
        const saved=S.sets[S.sets.length-1];
        setTimeout(()=>{saved.s='synced'; if(active==='E-03') repaint();},1400);
        startRest(); return;
      }
    }
    repaint();
  });
  function setView(v){
    document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.view===v)));
    document.getElementById('view-board').hidden=v!=='board';
    document.getElementById('view-play').hidden =v!=='play';
    document.getElementById('view-found').hidden=v!=='found';
    if(v==='board'){stopRest();S=fresh();board();}
    if(v==='play') play();
    if(v==='found') found();
    scrollTo({top:0});
  }
  const root=document.documentElement,btn=document.getElementById('themeBtn'),lbl=document.getElementById('themeLbl');
  const isLight=()=>{const s=root.getAttribute('data-theme');return s==='light'||(!s&&matchMedia('(prefers-color-scheme: light)').matches);};
  function syncLbl(){lbl.textContent=isLight()?'Light':'Dark';btn.setAttribute('aria-pressed',String(isLight()));}
  btn.addEventListener('click',()=>{root.setAttribute('data-theme',isLight()?'dark':'light');syncLbl();
    if(!document.getElementById('view-found').hidden) found();
    if(!document.getElementById('view-board').hidden) board();});
  matchMedia('(prefers-color-scheme: light)').addEventListener('change',syncLbl);
  syncLbl(); setView('found');
})();
</script>
