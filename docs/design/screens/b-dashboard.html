<title>Dashboard — Volt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../volt.css">

<div class="topbar"><div class="topbar-in">
  <a class="wordmark" href="../index.html">
    <svg class="bolt" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4 13.2h6L9.8 22 20 10.6h-6.4L13.5 2Z"/></svg>
    Volt <span class="sub">B · Dashboard</span></a>
  <div class="tabs" role="tablist" aria-label="View">
    <button class="tab" role="tab" aria-selected="true"  data-view="board">Screens</button>
    <button class="tab" role="tab" aria-selected="false" data-view="play">Prototype</button>
  </div>
  <span class="spacer"></span>
  <a class="chip-btn" href="../index.html">All domains</a>
  <button class="chip-btn" id="themeBtn" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    <span id="themeLbl">Dark</span></button>
</div></div>

<div class="sheetwrap">
  <section id="view-board"></section>
  <section id="view-play" hidden></section>
</div>

<script src="../volt-shell.js"></script>
<script>
(function(){
const S=VoltShell, I=S.I, nav=S.nav, tabbar=S.tabbar;
const macro=(cls,n,v,t,pct)=>`<div class="m ${cls}"><span class="n">${n}</span>
  <span class="b"><i style="width:${pct}%"></i></span><span class="v">${v}<span class="t3" style="font-size:11px">/${t}</span></span></div>`;

const wk=(days)=>`<div class="week">${['M','T','W','T','F','S','S'].map((d,i)=>
  `<div><div class="d">${d}</div><div class="m ${days[i]||''}">${days[i]==='done'?I.check:''}</div></div>`).join('')}</div>`;

window.VOLT={title:"Dashboard",intro:"BRD §14 in full — today's training, nutrition, weight, weekly consistency, a configurable chart and quick actions. One aggregated API call backs the whole screen, because five requests on the most-opened surface is the difference between a 400ms and a 1.4s dashboard.",screens:[

{id:'B-01',name:'Home dashboard',route:'/home',html:()=>`
<div class="screen">
  <div class="scr-head">${nav({back:false,title:'Tuesday, 21 Sep',
    right:`${I.bell}<span class="avatar">AB</span>`})}</div>
  <div class="scr-body">
    <div class="lbl">Today's workout</div>
    <div class="card hero mt8">
      <div class="row btw"><span class="pill pill-mute">Push / Pull / Legs</span>
        <span class="f12 t3">Last done 5d ago</span></div>
      <div class="display mt12" style="font-size:32px">Chest &amp; Triceps</div>
      <div class="f13 t3 mt4">6 exercises &middot; about 52 min</div>
      <div class="btnrow mt16">
        <button class="btn btn-primary btn-sm">Start workout</button>
        <button class="btn btn-ghost btn-sm" style="flex:0 0 84px">Swap</button></div>
    </div>

    <div class="lbl mt24">Today's nutrition</div>
    <div class="card hero mt8">
      <div class="ctr"><div class="display" style="font-size:58px">1,180</div>
        <div class="f13 t3 mt4">kcal left &middot; <span class="num">1,160</span> of <span class="num">2,340</span></div></div>
      <div class="meter lg mt12"><i style="width:50%"></i></div>
      <div class="macro mt16">
        ${macro('mp','Protein','78','176 g',44)}
        ${macro('mc','Carbs','104','234 g',44)}
        ${macro('mf','Fat','41','78 g',53)}
      </div>
      <div class="dash mt12" style="padding:10px 12px">
        <div class="row g8"><span style="color:var(--accent);width:14px;height:14px;display:block">${I.sparkle}</span>
          <span class="f12 t2" style="flex:1">1 item waiting for you to check</span>
          <span class="pill pill-est">Est.</span></div></div>
      <div class="btnrow mt12">
        <button class="btn btn-ghost btn-xs">Log a meal</button>
        <button class="btn btn-ghost btn-xs">${I.camera} Scan</button></div>
    </div>

    <div class="lbl mt24">Weight</div>
    <div class="card mt8">
      <div class="row btw"><span class="display" style="font-size:34px">78.4<span class="f13 t3" style="font-size:14px"> kg</span></span>
        <span class="dlt down">&#9660; 0.6 kg / 14d</span></div>
      <svg class="chart mt12" viewBox="0 0 320 54" preserveAspectRatio="none" height="54" aria-label="Weight trend, 14 days">
        <path class="ar" d="M0 34 L26 30 L52 33 L78 26 L104 30 L130 22 L156 26 L182 18 L208 22 L234 14 L260 18 L286 12 L320 16 L320 54 L0 54Z"/>
        <path class="ln" d="M0 34 L26 30 L52 33 L78 26 L104 30 L130 22 L156 26 L182 18 L208 22 L234 14 L260 18 L286 12 L320 16"/>
        <circle class="pt" cx="320" cy="16" r="4"/></svg>
      <div class="row btw mt8 f12 t3"><span>7-day avg 78.6 kg</span><span>Logged 2 days ago</span></div>
    </div>

    <div class="lbl mt24">This week</div>
    <div class="card mt8">
      ${wk(['done','done','','','','',''])}
      <div class="row btw mt12 f12"><span class="t3">Workouts</span>
        <span><span class="num">2</span> <span class="t3">of 4 planned</span></span></div>
      <div class="row btw mt4 f12"><span class="t3">Volume</span>
        <span><span class="num">14,280</span> <span class="t3">kg</span> <span class="dlt up">&#9650; 8%</span></span></div>
    </div>

    <div class="lbl mt24">Bench press &middot; estimated 1RM</div>
    <div class="card mt8">
      <svg class="chart" viewBox="0 0 320 90" height="90" aria-label="Estimated one rep max over 8 weeks">
        <line class="grid" x1="0" y1="78" x2="320" y2="78"/><line class="grid" x1="0" y1="40" x2="320" y2="40"/>
        <path class="ln" d="M6 66 L50 60 L94 62 L138 48 L182 44 L226 34 L270 30 L314 18"/>
        <circle class="pt" cx="314" cy="18" r="4.5"/>
        <text x="6" y="80" text-anchor="start">104</text><text x="314" y="14" text-anchor="end">118 kg</text></svg>
      <div class="row btw mt8 f12 t3"><span>Last 8 weeks &middot; Epley</span><span class="dlt up">&#9650; 14 kg</span></div>
    </div>
    <button class="btn btn-ghost btn-sm mt16">Customize dashboard</button>
  </div>
  ${tabbar('home')}
</div>`},

{id:'B-01b',name:'Dashboard — first run',route:'/home (empty)',html:()=>`
<div class="screen">
  <div class="scr-head">${nav({back:false,title:'Tuesday, 21 Sep',right:`<span class="avatar">AB</span>`})}</div>
  <div class="scr-body">
    <div class="display" style="font-size:28px">Let's get your<br>first data in.</div>
    <p class="f13 t3 mt8">Your charts appear once there's something to plot.</p>
    <div class="card mt20">
      <div class="linkrow"><span class="cbx"></span><div class="t"><b>Log your first workout</b>
        <span>Takes about a minute</span></div><button class="btn btn-ghost btn-xs" style="width:auto;padding:0 14px">Start</button></div>
      <div class="linkrow"><span class="cbx"></span><div class="t"><b>Log a meal</b>
        <span>Search, describe it, or snap a photo</span></div><button class="btn btn-ghost btn-xs" style="width:auto;padding:0 14px">Log</button></div>
      <div class="linkrow"><span class="cbx"></span><div class="t"><b>Record your weight</b>
        <span>Starts your trend line</span></div><button class="btn btn-ghost btn-xs" style="width:auto;padding:0 14px">Add</button></div>
      <div class="linkrow"><span class="cbx on">${I.check}</span><div class="t"><b>Set your targets</b>
        <span>2,340 kcal &middot; 176 g protein</span></div><span class="c" style="color:var(--good)">${I.check}</span></div>
    </div>
    <div class="empty mt20"><div class="ic">${I.chart}</div>
      <b>No charts yet</b><p>Log a workout, a meal or your weight and this fills in.</p></div>
  </div>
  ${tabbar('home')}
</div>`},

{id:'B-02',name:'Customize dashboard',route:'/home/customize',html:()=>{
  const r=(n,on,sub)=>`<div class="swrow"><span class="t3" style="width:18px">${I.drag}</span>
    <div class="t"><b>${n}</b>${sub?`<span>${sub}</span>`:''}</div>
    <span class="sw ${on?'on':''}"><i></i></span></div>`;
  return `
<div class="screen">
  <div class="scr-head">${nav({title:'Customize',sub:'Drag to reorder',right:'<span class="pill pill-live">Save</span>'})}</div>
  <div class="scr-body">
    <div class="card pad0" style="padding:0 16px">
      ${r("Today's workout",1)}${r("Today's nutrition",1)}${r("Weight",1)}
      ${r("This week",1)}${r("Progress chart",1,"e1RM · Bench press · 8 weeks")}
      ${r("Personal records",0)}${r("Muscle balance",0)}${r("Recent meals",0)}
      ${r("Goal progress",0,"Nothing to show yet")}
    </div>
    <p class="note mt12">At least one card must stay visible. Layout syncs across your devices.</p>
    <button class="btn btn-ghost btn-sm mt16">Reset to default</button>
  </div>
</div>`}},

{id:'B-03',name:'Quick actions (FAB)',route:'sheet',html:()=>{
  const r=(ic,n,ai)=>`<div class="linkrow"><span class="ic">${ic}</span><div class="t"><b>${n}</b></div>
    ${ai?'<span class="pill pill-live">AI</span>':''}<span class="c">&rsaquo;</span></div>`;
  return `
<div class="screen">
  <div class="scr-head">${nav({back:false,title:'Tuesday, 21 Sep',right:`<span class="avatar">AB</span>`})}</div>
  <div class="scr-body" style="filter:blur(2px);opacity:.4" aria-hidden="true">
    <div class="card hero"><div class="display" style="font-size:30px">Chest &amp; Triceps</div></div>
    <div class="card hero mt16 ctr"><div class="display" style="font-size:52px">1,180</div></div>
  </div>
  <div class="ov"><div class="sheet"><div class="grab"></div>
    <div class="lbl">Quick log</div>
    <div class="mt8">
      ${r(I.dumbbell,'Start a workout')}${r(I.apple,'Log a meal')}
      ${r(I.camera,'Scan food',1)}${r(I.sparkle,'Describe a meal',1)}
      ${r(I.scale,'Log weight')}${r(I.timer,'Log a past workout')}
    </div>
  </div></div>
</div>`}},

{id:'B-04',name:'Notifications',route:'/notifications',html:()=>{
  const n=(ic,col,t,s,unread)=>`<div class="linkrow"><span class="ic" style="color:${col}">${ic}</span>
    <div class="t"><b>${t}</b><span>${s}</span></div>
    ${unread?'<span style="width:7px;height:7px;border-radius:50%;background:var(--accent);display:block"></span>':''}
    <span class="c">&rsaquo;</span></div>`;
  return `
<div class="screen">
  <div class="scr-head">${nav({title:'Notifications',right:'<span class="f12">Mark all</span>'})}</div>
  <div class="scr-body">
    <div class="lbl">Today</div>
    <div class="card mt8" style="padding:0 16px">
      ${n(I.sparkle,'var(--accent)','Your food photo is ready','3 items detected · 2 min ago',1)}
      ${n(I.trophy,'var(--accent)','New PR: Bench press 102.5 kg','Today',1)}
      ${n(I.cloudoff,'var(--warn)','2 changes couldn&rsquo;t sync','Tap to review',1)}
    </div>
    <div class="lbl mt24">Earlier</div>
    <div class="card mt8" style="padding:0 16px">
      ${n(I.timer,'var(--ink-3)','Time to log lunch','11:58 am')}
      ${n(I.dumbbell,'var(--ink-3)','Push day is scheduled today','7:00 am')}
    </div>
    <button class="btn btn-ghost btn-sm mt16">${I.gear} Notification settings</button>
  </div>
</div>`}},

{id:'B-05',name:'Global search',route:'/search',html:()=>`
<div class="screen">
  <div class="scr-head">
    <div class="row g10"><button class="ico" style="width:34px;height:34px;display:grid;place-items:center">${I.back}</button>
      <div class="search" style="flex:1"><span>${I.search}</span><span style="color:var(--ink)">bench</span></div></div>
    <div class="chips mt12"><span class="chip on">All</span><span class="chip">Exercises</span>
      <span class="chip">Foods</span><span class="chip">Sessions</span></div>
  </div>
  <div class="scr-body">
    <div class="lbl">Exercises</div>
    <div class="card mt8" style="padding:0 16px">
      <div class="linkrow"><span class="ic">${I.dumbbell}</span><div class="t"><b>Barbell Bench Press</b>
        <span>PR 102.5 kg · last 5d ago</span></div><span class="pill pill-pr">PR</span></div>
      <div class="linkrow"><span class="ic">${I.dumbbell}</span><div class="t"><b>Incline Bench Press</b>
        <span>last 5d ago</span></div><span class="c">&rsaquo;</span></div>
    </div>
    <div class="lbl mt20">Foods</div>
    <div class="card mt8" style="padding:0 16px">
      <div class="linkrow"><span class="ic">${I.apple}</span><div class="t"><b>Chicken breast, grilled</b>
        <span>165 kcal per 100 g</span></div><span class="c">&rsaquo;</span></div>
    </div>
    <div class="lbl mt20">Sessions</div>
    <div class="card mt8" style="padding:0 16px">
      <div class="linkrow"><span class="ic">${I.cal}</span><div class="t"><b>Chest &amp; Triceps</b>
        <span>16 Sep · 8,240 kg</span></div><span class="c">&rsaquo;</span></div>
    </div>
    <div class="lbl mt20">Recent searches</div>
    <div class="chips mt8"><span class="chip">squat</span><span class="chip">biryani</span><span class="chip">pull day</span></div>
  </div>
</div>`}

]};

VoltShell.mount();
})();
</script>
