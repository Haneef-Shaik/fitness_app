<title>System States — Volt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="../volt.css">

<div class="topbar"><div class="topbar-in">
  <a class="wordmark" href="../index.html">
    <svg class="bolt" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4 13.2h6L9.8 22 20 10.6h-6.4L13.5 2Z"/></svg>
    Volt <span class="sub">L · System</span></a>
  <div class="tabs" role="tablist" aria-label="View">
    <button class="tab" role="tab" aria-selected="true"  data-view="board">Screens</button>
    <button class="tab" role="tab" aria-selected="false" data-view="play">Prototype</button>
  </div>
  <span class="spacer"></span>
  <a class="chip-btn" href="../index.html">All domains</a>
  <button class="chip-btn" id="themeBtn" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    <span id="themeLbl">Dark</span></button>
</div></div>

<div class="sheetwrap">
  <section id="view-board"></section>
  <section id="view-play" hidden></section>
</div>

<script src="../volt-shell.js"></script>
<script>
(function(){
const S=VoltShell, I=S.I, nav=S.nav, tabbar=S.tabbar;
window.VOLT={title:"System States",intro:"The states that decide whether the app feels trustworthy when something goes wrong — which, over a year of daily use, it will. Nothing is ever dropped silently.",screens:[

{id:'L-01',name:'Empty states',route:'pattern',html:()=>{
  const e=(ic,t,p,a)=>`<div class="card mt12"><div class="empty" style="padding:22px 12px">
    <div class="ic">${ic}</div><b>${t}</b><p>${p}</p>
    <button class="btn btn-ghost btn-xs mt12" style="width:auto;padding:0 18px">${a}</button></div></div>`;
  return `
<div class="screen">
  <div class="scr-head">${nav({title:'Empty states',sub:'Shared pattern'})}</div>
  <div class="scr-body">
    <p class="note">Icon + title + <b class="t2">one</b> sentence + <b class="t2">one</b> action.
      Never a dead end, never a joke, never an exclamation mark.</p>
    ${e(I.dumbbell,'No workouts yet','Your completed sessions will appear here.','Start a workout')}
    ${e(I.apple,'Nothing logged yet','Add what you have eaten to see your totals.','Add food')}
    ${e(I.scale,'No weight logged','Log your weight to start the trend.','Log weight')}
    ${e(I.chart,'Not enough data','You will need at least 2 sessions in this range.','Widen the range')}
  </div>
</div>`}},

{id:'L-02',name:'Sync center',route:'/sync',html:()=>`
<div class="screen">
  <div class="scr-head">${nav({title:'Sync'})}</div>
  <div class="scr-body">
    <div class="dash" style="border-color:color-mix(in srgb,var(--warn) 45%,transparent)">
      <div class="row g8"><span style="color:var(--warn);width:16px;height:16px;display:block">${I.cloudoff}</span>
        <b class="f13">Offline since 14:22</b></div>
      <p class="note mt6">Everything you log is saved on this device and will upload automatically.</p></div>
    <div class="lblrow mt20"><span class="lbl">Waiting to upload</span><span class="num t2">4</span></div>
    <div class="card" style="padding:0 16px">
      <div class="linkrow"><span class="sync pending"></span><div class="t"><b>3 sets &middot; Chest &amp; Triceps</b>
        <span>14:31</span></div></div>
      <div class="linkrow"><span class="sync pending"></span><div class="t"><b>Weight 78.4 kg</b><span>08:14</span></div></div></div>
    <div class="lblrow mt20"><span class="lbl" style="color:var(--crit)">Could not upload</span><span class="num" style="color:var(--crit)">2</span></div>
    <div class="dash" style="border-color:color-mix(in srgb,var(--crit) 40%,transparent)">
      <div class="row g8"><span style="color:var(--crit)">${I.warn}</span><b class="f13">Set 3 &middot; Incline DB Press</b></div>
      <p class="note mt6">&ldquo;Reps must be at least 1&rdquo;</p>
      <div class="btnrow mt10"><button class="btn btn-ghost btn-xs">Fix</button>
        <button class="btn btn-ghost btn-xs">Discard</button></div></div>
    <div class="dash mt10" style="border-color:color-mix(in srgb,var(--crit) 40%,transparent)">
      <div class="row g8"><span style="color:var(--crit)">${I.warn}</span><b class="f13">Meal item &middot; Chicken biryani</b></div>
      <p class="note mt6">That meal no longer exists.</p>
      <div class="btnrow mt10"><button class="btn btn-ghost btn-xs">Add to another meal</button>
        <button class="btn btn-ghost btn-xs">Discard</button></div></div>
    <button class="btn btn-ghost btn-sm mt16">Retry everything</button>
    <p class="note ctr mt12">Last synced 21 Sep 14:22</p>
  </div>
</div>`},

{id:'L-03',name:'Error states',route:'pattern',html:()=>{
  const e=(t,b,a)=>`<div class="card mt12"><div class="empty" style="padding:20px 12px">
    <div class="ic" style="color:var(--serious)">${I.warn}</div><b>${t}</b><p>${b}</p>
    <button class="btn btn-ghost btn-xs mt12" style="width:auto;padding:0 18px">${a}</button>
    <p class="note mt8">Reference: req_8f2a19c</p></div></div>`;
  return `
<div class="screen">
  <div class="scr-head">${nav({title:'Error states',sub:'Shared pattern'})}</div>
  <div class="scr-body">
    <p class="note">Plain sentence + retry + a copyable request ID. Never a stack trace,
      never a bare code, never the word &ldquo;Oops&rdquo;.</p>
    ${e('Could not reach the server','Check your connection. Anything you logged is saved here.','Try again')}
    ${e('Could not load your history','Something went wrong on our side. We have logged it.','Try again')}
    ${e('We could not find that','It may have been deleted.','Go back')}
  </div>
</div>`}},

{id:'L-04',name:'Not found',route:'*',html:()=>`
<div class="screen">
  <div class="scr-head">${nav({title:''})}</div>
  <div class="scr-body" style="display:flex;align-items:center">
    <div class="empty" style="width:100%"><div class="ic">${I.search}</div>
      <b>We could not find that page</b>
      <p>It may have been deleted, or the link might be wrong.</p>
      <button class="btn btn-primary btn-sm mt16" style="width:auto;padding:0 24px">Go to my dashboard</button>
      <button class="btn btn-ghost btn-xs mt10" style="width:auto;padding:0 20px">Go back</button></div>
  </div>
</div>`},

{id:'L-05',name:'Session expired',route:'dialog',html:()=>`
<div class="screen">
  <div class="scr-head">${nav({back:false,title:'Incline Dumbbell Press'})}</div>
  <div class="scr-body" style="filter:blur(3px);opacity:.32" aria-hidden="true">
    <div class="card"><div class="padvals"><div class="padv"><span class="n">30</span><span class="u">kg</span></div>
      <span class="padx">&times;</span><div class="padv"><span class="n">9</span><span class="u">reps</span></div></div></div></div>
  <div class="ov mid"><div class="ovc">
    <b style="font-size:17px;font-weight:600">You have been signed out</b>
    <p class="f13 t2 mt8">Log back in to carry on. <b>Nothing you logged has been lost.</b></p>
    <div class="field mt16"><label>Email</label><div class="input t3">you@example.com</div></div>
    <div class="field"><label>Password</label><div class="input focus">&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;</div></div>
    <div class="btnrow mt12"><button class="btn btn-ghost btn-sm">Go to login</button>
      <button class="btn btn-primary btn-sm">Log back in</button></div>
    <p class="note mt12">Re-authenticates in place &mdash; you stay exactly where you were,
      including mid-workout. The logger keeps working offline behind this dialog.</p>
  </div></div>
</div>`},

{id:'L-06',name:'Permission primer',route:'dialog',html:()=>`
<div class="screen">
  <div class="scr-head">${nav({back:false,title:'Add food'})}</div>
  <div class="scr-body" style="filter:blur(3px);opacity:.32" aria-hidden="true">
    <div class="card"><b>Search foods</b></div><div class="card mt10"><b>Take a photo</b></div></div>
  <div class="ov mid"><div class="ovc ctr">
    <div style="width:54px;height:54px;margin:0 auto;border-radius:17px;display:grid;place-items:center;
      background:var(--accent-wash);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)">
      <span style="width:24px;height:24px;display:block">${I.camera}</span></div>
    <b class="mt16" style="display:block;font-size:17px;font-weight:600">Use your camera for food?</b>
    <p class="f13 t2 mt8" style="line-height:1.55">Take a photo of a meal and we will estimate what is in it.
      Photos are private and you can delete them any time.</p>
    <div class="btnrow mt20"><button class="btn btn-ghost btn-sm">Not now</button>
      <button class="btn btn-primary btn-sm">Allow camera</button></div>
    <p class="note mt12">Always shown <b class="t2">before</b> the OS prompt.
      &ldquo;Not now&rdquo; does not trigger it, so you can still say yes later.</p>
  </div></div>
</div>`},

{id:'L-07',name:'Sync conflict',route:'dialog',html:()=>`
<div class="screen">
  <div class="scr-head">${nav({back:false,title:'Chest &amp; Triceps'})}</div>
  <div class="scr-body" style="filter:blur(3px);opacity:.32" aria-hidden="true">
    <div class="card"><b>21 sets</b></div></div>
  <div class="ov mid"><div class="ovc">
    <b style="font-size:17px;font-weight:600">This was changed somewhere else</b>
    <p class="f13 t2 mt8">&ldquo;Chest &amp; Triceps&rdquo; was edited on another device at 14:31.</p>
    <div class="row g10 mt16">
      <div class="card" style="flex:1;border-color:color-mix(in srgb,var(--accent) 45%,transparent)">
        <div class="lbl">This device</div><div class="num mt6" style="font-size:20px">21 sets</div>
        <div class="num t2" style="font-size:15px">8,940 kg</div><div class="f11 t3 mt4">edited 14:35</div></div>
      <div class="card" style="flex:1">
        <div class="lbl">The other one</div><div class="num mt6" style="font-size:20px">19 sets</div>
        <div class="num t2" style="font-size:15px">8,420 kg</div><div class="f11 t3 mt4">edited 14:31</div></div></div>
    <div class="stack g10 mt16">
      <button class="btn btn-primary btn-sm">Keep this device&rsquo;s</button>
      <button class="btn btn-ghost btn-sm">Keep the other one</button>
      <button class="btn btn-ghost btn-sm">Show me the difference</button></div>
    <p class="note mt12">Set-level conflicts never reach this dialog &mdash; sets are idempotent on their
      client ID, so replaying the outbox merges rather than conflicts.</p>
  </div></div>
</div>`},

{id:'L-08',name:'Maintenance / degraded',route:'/maintenance',html:()=>`
<div class="screen">
  <div class="scr-head">${nav({back:false,title:''})}</div>
  <div class="scr-body">
    <div class="empty" style="padding-top:40px"><div class="ic">${I.gear}</div>
      <b>We are doing some maintenance</b>
      <p>Back around 03:00 UTC. Anything you log on this device will upload when we are up.</p>
      <button class="btn btn-primary btn-sm mt16" style="width:auto;padding:0 22px">Keep using it offline</button></div>
    <div class="lbl mt24">Degraded &mdash; AI unavailable</div>
    <div class="dash mt8" style="border-color:color-mix(in srgb,var(--warn) 45%,transparent)">
      <div class="row g8"><span style="color:var(--accent);width:15px;height:15px;display:block">${I.sparkle}</span>
        <span class="f13" style="flex:1">Food photo analysis is temporarily unavailable</span></div>
      <p class="note mt6">Search and manual entry work as usual.</p></div>
    <div class="well mt16"><p class="note"><b class="t2">Nothing about workout logging, meal logging, history
      or analytics is affected.</b> That containment is the whole point of keeping AI on its own service.</p></div>
  </div>
</div>`}

]};

VoltShell.mount();
})();
</script>
