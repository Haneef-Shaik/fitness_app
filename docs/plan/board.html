<title>FitLog master plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a workflow canvas (lanes = people, columns = the earliest step a goal can start), with tabs for the ready list, a table and the update feed. */
:root {
  --bg: #e9edf1;
  --panel: #ffffff;
  --ink: #18212b;
  --muted: #5b6876;
  --line: #d3d9e0;
  --canvas: #f1f4f7;
  --dot: #c4ccd5;
  --band: rgba(24, 33, 43, 0.025);
  --lane: rgba(255, 255, 255, 0.55);
  --lane-line: #dde2e8;
  --node: #ffffff;
  --node-line: #cfd6de;
  --handle: #9aa5b1;
  --edge: #a3adb9;
  --shadow: 0 1px 2px rgba(20, 30, 40, 0.08), 0 2px 8px rgba(20, 30, 40, 0.05);
  --accent: #0f6c74;
  --accent-ink: #ffffff;
  --done: #1d8a4c;   --done-soft: #ddf3e5;
  --ready: #2457d6;  --ready-soft: #e1e9fd;
  --running: #b7740b; --running-soft: #fbefd6;
  --review: #7446c4; --review-soft: #ece4fa;
  --blocked: #7f8a96; --blocked-soft: #eceff2;
  --hold: #b2502a;   --hold-soft: #f8e4dc;
  --unknown: #a3adb9; --unknown-soft: #eef1f4;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --panel: #192028; --ink: #e5eaf0; --muted: #94a1af; --line: #2b343f;
    --canvas: #141a21; --dot: #2a333e; --band: rgba(255, 255, 255, 0.02); --lane: rgba(255, 255, 255, 0.025);
    --lane-line: #26303a; --node: #1d252e; --node-line: #34404c; --handle: #6c7885; --edge: #55616e;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 10px rgba(0, 0, 0, 0.25);
    --accent: #3fb5bd; --accent-ink: #0b1b1d;
    --done: #4cc07c; --done-soft: #183526; --ready: #6d97ff; --ready-soft: #1b2a4d;
    --running: #e3a63b; --running-soft: #3a2c12; --review: #a985ec; --review-soft: #2d2346;
    --blocked: #8995a2; --blocked-soft: #232b34; --hold: #e57b52; --hold-soft: #3c2219;
    --unknown: #66727f; --unknown-soft: #20272f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --panel: #192028; --ink: #e5eaf0; --muted: #94a1af; --line: #2b343f;
  --canvas: #141a21; --dot: #2a333e; --band: rgba(255, 255, 255, 0.02); --lane: rgba(255, 255, 255, 0.025);
  --lane-line: #26303a; --node: #1d252e; --node-line: #34404c; --handle: #6c7885; --edge: #55616e;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 2px 10px rgba(0, 0, 0, 0.25);
  --accent: #3fb5bd; --accent-ink: #0b1b1d;
  --done: #4cc07c; --done-soft: #183526; --ready: #6d97ff; --ready-soft: #1b2a4d;
  --running: #e3a63b; --running-soft: #3a2c12; --review: #a985ec; --review-soft: #2d2346;
  --blocked: #8995a2; --blocked-soft: #232b34; --hold: #e57b52; --hold-soft: #3c2219;
  --unknown: #66727f; --unknown-soft: #20272f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }

.app { height: 100%; display: flex; flex-direction: column; gap: 10px; padding-inline: 16px; padding-block: 12px; min-width: 0; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.brand h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--unknown); }
.live[data-state="live"]::before { background: var(--done); box-shadow: 0 0 0 3px var(--done-soft); }
.live[data-state="syncing"]::before { background: var(--running); }
.live[data-state="offline"]::before, .live[data-state="error"]::before { background: var(--hold); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--handle); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.06); border-color: var(--accent); }
.btn:disabled { opacity: 0.55; cursor: default; }

.summary { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 11px 4px 6px; font-size: 13px; }
.chip .dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--state-soft); color: var(--state); }
.chip .dot svg { width: 12px; height: 12px; }
.chip b { font-variant-numeric: tabular-nums; font-weight: 600; }
.chip[aria-pressed="true"] { border-color: var(--state); box-shadow: inset 0 0 0 1px var(--state); }
.total { font-size: 13px; color: var(--muted); }
.total b { color: var(--ink); font-variant-numeric: tabular-nums; }
.people { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 6px 14px; flex: 1 1 520px; min-width: 0; }
.person { min-width: 0; }
.person-top { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; }
.person-top span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: var(--line); margin-top: 3px; }
.bar i { display: block; height: 100%; }

.tabs { display: flex; gap: 2px; box-shadow: inset 0 -1px 0 var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 7px 12px; font-size: 13.5px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .count { font-variant-numeric: tabular-nums; margin-left: 4px; color: var(--muted); font-weight: 400; }

.views { flex: 1; min-height: 0; position: relative; }
.view { height: 100%; overflow: auto; min-width: 0; }
#view-graph { overflow: hidden; }

/* canvas */
.canvas { position: relative; height: 100%; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; touch-action: none; cursor: grab;
  background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1.1px, transparent 1.3px); background-size: 20px 20px; }
.canvas.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.band { position: absolute; top: 0; background: var(--band); }
.colhead { position: absolute; top: 12px; text-align: center; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lane { position: absolute; left: 6px; border-radius: 14px; background: var(--lane); border: 1px solid var(--lane-line); }
.lane-label { position: absolute; left: 16px; top: 16px; width: 130px; }
.lane-name { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 15px; }
.lane-name i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.lane-meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.lane .bar { width: 120px; margin-top: 6px; }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
svg.edges path { fill: none; stroke: var(--edge); stroke-width: 1.4; stroke-dasharray: 4 4; opacity: 0.75; transition: opacity 0.15s; }
svg.edges path.e-done { stroke: var(--done); stroke-dasharray: none; opacity: 0.5; }
svg.edges path.e-hub { display: none; }
.has-focus svg.edges path.e-hub.lit { display: inline; }
.has-focus svg.edges path { opacity: 0.06; }
.has-focus svg.edges path.lit { opacity: 1; stroke-width: 2.4; }

.node { position: absolute; display: flex; align-items: stretch; padding: 0; text-align: left; border: 1px solid color-mix(in srgb, var(--state) 40%, var(--node-line));
  background: var(--node); border-radius: 10px; box-shadow: var(--shadow); transition: opacity 0.15s, transform 0.12s; }
.node:hover { transform: translateY(-1px); border-color: var(--state); }
.node .tile { width: 40px; flex: none; display: grid; place-items: center; background: var(--state-soft); color: var(--state); border-radius: 9px 0 0 9px; border-right: 1px solid color-mix(in srgb, var(--state) 25%, transparent); }
.node .tile svg { width: 18px; height: 18px; }
.node .body { display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 6px 9px; min-width: 0; flex: 1; }
.row1 { display: flex; align-items: center; gap: 5px; min-width: 0; overflow: hidden; }
.gid { font-family: var(--font-mono); font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
.tag { font-family: var(--font-mono); font-size: 9.5px; font-weight: 600; line-height: 1; padding: 2px 4px; border-radius: 4px; border: 1px solid var(--node-line); color: var(--muted); }
.tag.sp { background: var(--ink); border-color: var(--ink); color: var(--panel); }
.tag.m1 { background: var(--hold); border-color: var(--hold); color: var(--panel); }
.node .lbl { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.lblrow { display: flex; align-items: center; gap: 3px; min-width: 0; }
.hb { flex: none; width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; font: 600 8.5px/1 var(--font-mono);
  background: var(--state-soft); color: var(--state); border: 1px solid color-mix(in srgb, var(--state) 55%, transparent); }
.hb.s-done { background: var(--done); color: var(--panel); border-color: var(--done); }
.node .h { position: absolute; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--node); border: 1.5px solid var(--handle); }
.node .h-in { left: -5px; } .node .h-out { right: -5px; }
.node.s-done .h { border-color: var(--done); }
.node.s-blocked .gid, .node.s-unknown .gid { color: var(--muted); }
.node.s-running::after { content: ""; position: absolute; inset: -5px; border-radius: 14px; border: 2px solid var(--running); opacity: 0.55; animation: pulse 1.8s ease-in-out infinite; pointer-events: none; }
@keyframes pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.7; } }
@media (prefers-reduced-motion: reduce) { .node.s-running::after { animation: none; opacity: 0.6; } .node, svg.edges path { transition: none; } }
.node.fade { opacity: 0.2; }
.has-focus .node { opacity: 0.16; }
.has-focus .node.lit { opacity: 1; }
.node.sel { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent), var(--shadow); }
.m1-star { position: absolute; font-weight: 700; font-size: 13px; color: var(--hold); font-family: var(--font-mono); }

.s-done { --state: var(--done); --state-soft: var(--done-soft); }
.s-ready { --state: var(--ready); --state-soft: var(--ready-soft); }
.s-running { --state: var(--running); --state-soft: var(--running-soft); }
.s-review { --state: var(--review); --state-soft: var(--review-soft); }
.s-blocked { --state: var(--blocked); --state-soft: var(--blocked-soft); }
.s-hold { --state: var(--hold); --state-soft: var(--hold-soft); }
.s-unknown { --state: var(--unknown); --state-soft: var(--unknown-soft); }

.tools { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.tools > * { pointer-events: auto; }
.field { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 10px; font-size: 13px; min-width: 0; }
.tools .field { box-shadow: var(--shadow); }
#search { width: 190px; }
.zoom { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 4px; }
.zoom button { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; box-shadow: var(--shadow); padding: 0; }
.zoom button svg { width: 16px; height: 16px; }
.key { position: absolute; right: 10px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); }
.key svg { width: 28px; height: 8px; vertical-align: middle; margin-right: 4px; }
.notice { position: absolute; left: 50%; top: 56px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: var(--shadow); max-width: min(460px, calc(100% - 24px)); text-align: center; }

/* side views */
.pad { padding: 14px 2px 24px; }
.lead { margin: 0 0 14px; color: var(--muted); max-width: 70ch; font-size: 13.5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.card h2 i { width: 9px; height: 9px; border-radius: 50%; }
.card h3 { margin: 12px 0 6px; font-size: 11.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.items { display: flex; flex-direction: column; gap: 4px; }
.item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 8px; padding: 5px 6px; min-width: 0; }
.item:hover { background: var(--canvas); border-color: var(--line); }
.item .pip { width: 22px; height: 22px; border-radius: 6px; flex: none; display: grid; place-items: center; background: var(--state-soft); color: var(--state); }
.item .pip svg { width: 13px; height: 13px; }
.item .txt { min-width: 0; flex: 1; font-size: 13px; }
.item .txt span { color: var(--muted); }
.item .aside { font-size: 12px; color: var(--muted); white-space: nowrap; }
.empty { font-size: 13px; color: var(--muted); padding: 2px 6px; }

.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; min-width: 920px; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--panel); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; z-index: 1; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--canvas); }
td.num { font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 5px; border-radius: 999px; background: var(--state-soft); color: var(--state); font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill svg { width: 12px; height: 12px; }

.feed { display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
.entry { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; }
.entry img { width: 26px; height: 26px; border-radius: 50%; flex: none; }
.entry .what { font-size: 13.5px; }
.entry .when { font-size: 12px; color: var(--muted); }
.entry .note { font-size: 13px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.linkish { border: 0; background: none; padding: 0; font-family: var(--font-mono); font-weight: 600; color: var(--accent); }

/* drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); z-index: 30; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0, 0, 0, 0.12);
  overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.d-id { font-family: var(--font-mono); font-size: 22px; font-weight: 600; margin: 0; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 0; flex: none; }
.icon-btn svg { width: 16px; height: 16px; }
.d-title { margin: 8px 0 12px; font-size: 15px; line-height: 1.5; text-wrap: pretty; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; margin: 0 0 14px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.d-sec { margin: 16px 0 6px; font-size: 11.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.chipset { display: flex; flex-wrap: wrap; gap: 5px; }
.gchip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid color-mix(in srgb, var(--state) 40%, var(--line)); background: var(--state-soft); color: var(--ink); border-radius: 7px; padding: 3px 7px; font-size: 12px; }
.gchip b { font-family: var(--font-mono); font-weight: 600; color: var(--state); }
.gchip svg { width: 12px; height: 12px; color: var(--state); }
.verdict { font-size: 13.5px; padding: 8px 10px; border-radius: 8px; background: var(--state-soft); border: 1px solid color-mix(in srgb, var(--state) 35%, transparent); margin-top: 8px; }
form.upd { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg label { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 13px; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label:has(input:checked) { border-color: var(--state); background: var(--state-soft); color: var(--ink); box-shadow: inset 0 0 0 1px var(--state); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg svg { width: 13px; height: 13px; color: var(--state); }
.frow { display: flex; flex-direction: column; gap: 4px; }
.frow label { font-size: 12.5px; color: var(--muted); }
.frow .field { width: 100%; }
textarea.field { resize: vertical; min-height: 60px; }
.f-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stamp { font-size: 12px; color: var(--muted); }
.ro { font-size: 13px; color: var(--muted); background: var(--canvas); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 9px; font-size: 13px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }

@media (max-width: 760px) {
  .people { grid-template-columns: repeat(2, minmax(0, 1fr)); flex-basis: 100%; }
  .key { display: none; }
  #search { width: 150px; }
  .brand h1 { font-size: 17px; }
}
</style>

  <symbol id="i-ready" viewBox="0 0 16 16"><path d="M5 3.2v9.6L12.6 8z" fill="currentColor"/></symbol>

  <symbol id="i-review" viewBox="0 0 16 16"><path d="M1.5 8s2.4-4.5 6.5-4.5S14.5 8 14.5 8 12.1 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="currentColor"/></symbol>

/* ---------- geometry ---------- */

  const rows = Math.max(...mine.map(g => g.r)) + 1;
  const hgt = LANE_PAD * 2 + rows * ROW_H - (ROW_H - NODE_H);

/* ---------- build the canvas once ---------- */

    if (s % 2 === 0) world.append(h("div", { class: "band", style: `left:${x}px;width:${COL_W}px;height:${WORLD_H}px` }));
    world.append(h("div", { class: "colhead", style: `left:${x}px;width:${COL_W}px`, text: stepName(s) }));

function csvCell(v) { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
async function exportCsv() {
  const head = ["Goal", "Owner", "Earliest step", "Size", "Short name", "Outcome", "State", "Status", "Who", "Branch / PR / commit", "Note", "Needs", "Waiting on", "Unblocks", "Updated"];
  const rows = GOALS.map(g => {
    const r = rec(g.id) || {}, st = stateOf(g.id);
    return [g.id, g.o, g.st, g.s, g.l, g.t, STATE[st].label, STATUS_LABEL[statusOf(g.id)], r.who || "", r.ref || "", r.note || "",
      g.n.join(", "), st === "done" ? "" : openNeeds(g.id).map(goalText).join(", "), DEPENDENTS.get(g.id).join(", "), r.at || ""];
  });
  const csv = [head, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
  try { await S.downloads.save({ filename: `${CFG.slug || "goals"}-${new Date().toISOString().slice(0, 10)}.csv`, data: csv }); }
  catch (e) { if (e && e.code !== "declined") toast("Export failed: " + (e.message || e.code)); }
}
function wireUi() {
  $("meta").textContent = CFG.subtitle || `${GOALS.length} goals. Columns are the earliest step a goal can start.`;
  $("workflowHint").textContent = CFG.workflowHint || "A goal is ready to run when every goal it needs is Done and nobody has started it. Mark it Running when work starts, In review when it is waiting for review, and Done when it lands.";
  $("search").placeholder = `Find a goal, e.g. ${GOALS[Math.min(3, GOALS.length - 1)].id}`;
  if (HUBS.length) { const k = $("hubKey"); k.hidden = false; k.append(h("b", { class: "mono", text: HUBS.map(b => b.key).join(" ") }), " " + HUBS.map(b => b.text).join(", ") + " (filled when done)"); }
  for (const t of document.querySelectorAll(".tab")) t.addEventListener("click", () => showView(t.dataset.view));
  $("goalIds").replaceChildren(...GOALS.map(g => h("option", { value: g.id, text: g.l })));
  const personOpts = sel => sel.replaceChildren(h("option", { value: "", text: "Everyone" }), ...PEOPLE.map(p => h("option", { value: p.name, text: p.name })));
  personOpts($("personFilter"));
  personOpts($("listPerson"));
  $("listState").replaceChildren(h("option", { value: "", text: "Any state" }), ...STATES.map(s => h("option", { value: s.key, text: s.label })));
  $("personFilter").addEventListener("change", e => { S.person = e.target.value; store.set("goalboard.person", S.person); paintFocus(); });
  for (const id of ["listPerson", "listState"]) $(id).addEventListener("change", paintList);
  $("listSearch").addEventListener("input", paintList);
  const go = () => { const id = findGoal($("search").value); if (id) { select(id, { reveal: true }); } else if ($("search").value.trim()) toast("No goal with that id."); };
  $("search").addEventListener("change", go);
  $("search").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  $("exportBtn").addEventListener("click", exportCsv);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && S.selected) select(null); });
  const savedPerson = store.get("goalboard.person");
  if (savedPerson && PERSON.has(savedPerson)) { S.person = savedPerson; $("personFilter").value = savedPerson; }
}
function setLive(state, text) {
  const el = $("live");
  el.dataset.state = state;
  el.textContent = text;
}

/* ---------- live data ---------- */
async function connect() {
  const C = window.claude;
  if (!C || typeof C.use !== "function") return offline();
  const [db, user, downloads] = await Promise.all([C.use("db"), C.use("user"), C.use("downloads")]);
  S.user = user;
  S.downloads = downloads;
  if (downloads) $("exportBtn").hidden = false;
  if (user) {
    S.myId = await user.id();
    if ((await user.can("data.write")) === false) S.readOnly = true;
  }
  if (!db) return offline();
  S.db = db;
  S.phase = "live";
  setLive("syncing", "Syncing");
  db.collection("goals").onSnapshot(snap => {
    const m = new Map();
    for (const d of snap.docs) if (d.exists) m.set(d.id, d.data());
    S.status = m;
    S.loaded = true;
    $("notice").hidden = true;
    setLive(snap.metadata.fromCache ? "syncing" : "live", (snap.metadata.fromCache ? "Syncing" : "Live") + (S.readOnly ? " · view only" : ""));
    paintAll();
  }, err => {
    setLive("error", "Live updates stopped");
    toast(err && err.code === "revoked" ? "Your access to this board changed. Reload to continue." : "Live updates stopped. Reload the page to reconnect.");
  });
  db.collection("activity").orderBy("at", "desc").limit(60).onSnapshot(snap => {
    S.activity = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, ...d.data() }));
    if (!$("view-updates").hidden) paintFeed();
  }, () => { /* the goals listener reports connection problems */ });
}
function offline() {
  S.phase = "offline";
  if (S.selected) paintDrawer();
  setLive("offline", "Live status unavailable");
  const n = $("notice");
  n.hidden = false;
  n.textContent = "Live status is not available in this view. Open the board on claude.ai while signed in to see who is on what.";
  paintFeed();
}

buildGraph();
wireCanvas();
wireUi();
paintAll();
requestAnimationFrame(fit);
const savedView = store.get("goalboard.view");
if (savedView && ["graph", "ready", "list", "updates"].includes(savedView)) showView(savedView);
connect().catch(err => { console.error(err); offline(); });
</script>
