services:
  db:
    image: postgres:16-alpine
    container_name: fitlog-db
    environment:
      POSTGRES_USER: fitlog
      POSTGRES_PASSWORD: fitlog
      POSTGRES_DB: fitlog
    ports: ["5432:5432"]
    volumes: ["fitlog-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlog -d fitlog"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:16-alpine
    container_name: fitlog-db-test
    environment:
      POSTGRES_USER: fitlog
      POSTGRES_PASSWORD: fitlog
      POSTGRES_DB: fitlog_test
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]      # ephemeral — fast, wiped every run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitlog -d fitlog_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  fitlog-pgdata:
