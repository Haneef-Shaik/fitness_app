services:
  db:
    image: postgres:16-alpine
    container_name: volt-db
    environment:
      POSTGRES_USER: volt
      POSTGRES_PASSWORD: volt
      POSTGRES_DB: volt
    ports: ["5432:5432"]
    volumes: ["volt-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volt -d volt"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-test:
    image: postgres:16-alpine
    container_name: volt-db-test
    environment:
      POSTGRES_USER: volt
      POSTGRES_PASSWORD: volt
      POSTGRES_DB: volt_test
    ports: ["5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]      # ephemeral — fast, wiped every run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volt -d volt_test"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  volt-pgdata:
