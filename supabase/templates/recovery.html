<!-- A-05 reset email. Hosted: Authentication → Email Templates → Reset Password.
     The link opens the app on the phone that asked (PKCE); the code is for
     anywhere else — typed into the app's "I have a code". -->
<h2>Reset your FitLog password</h2>
<p>On the phone you asked from, tap:</p>
<p><a href="{{ .ConfirmationURL }}">Choose a new password</a></p>
<p>Reading this somewhere else? In the app, tap <b>I have a code</b> and enter:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p>
<p>The link and the code work once, for an hour. If you did not ask for this,
ignore this email — your password stays as it is.</p>
